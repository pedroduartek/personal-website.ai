<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151B23" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon_v2.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/pld_logo_header.webp" type="image/webp" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/SpaceGrotesk-variable.woff2" crossorigin />
    <script>
      ;(() => {
        const storageKey = 'pedroduartek-theme'
        const metaColors = {
          light: '#f4f7fb',
          dark: '#151b23',
        }

        let storedTheme = null
        try {
          storedTheme = window.localStorage.getItem(storageKey)
        } catch {}

        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : 'dark'

        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', metaColors[theme])
      })()
    </script>
    <!--
      Static SEO / social fallback. Crawlers such as the LinkedIn, WhatsApp,
      Slack and X link-preview bots do not execute JavaScript, so these tags
      must exist in the served HTML. At runtime PageSEO.tsx finds these exact
      elements by selector and rewrites their content per route, so keep the
      attribute forms below (name="..." / property="...") in sync with it.
    -->
    <title>Pedro Duarte - Senior Software Engineer, C#/.NET</title>
    <meta
      name="description"
      content="Senior Software Engineer in Lisbon, Portugal, designing backend platforms in C#/.NET, microservices and event-driven systems. Tech lead and mentor."
    />
    <link rel="canonical" href="https://www.pedroduartek.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PEDRODUARTEK" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Pedro Duarte - Senior Software Engineer, C#/.NET" />
    <meta
      property="og:description"
      content="Senior Software Engineer in Lisbon, Portugal, designing backend platforms in C#/.NET, microservices and event-driven systems. Tech lead and mentor."
    />
    <meta property="og:url" content="https://www.pedroduartek.com/" />
    <meta property="og:image" content="https://www.pedroduartek.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pedro Duarte, Senior Software Engineer, www.pedroduartek.com" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pedro Duarte - Senior Software Engineer, C#/.NET" />
    <meta
      name="twitter:description"
      content="Senior Software Engineer in Lisbon, Portugal, designing backend platforms in C#/.NET, microservices and event-driven systems. Tech lead and mentor."
    />
    <meta name="twitter:image" content="https://www.pedroduartek.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
